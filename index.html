<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Weighted Grade Calculator</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18253b; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    main { width: min(100%, 720px); background: #fff; border-radius: 22px; padding: clamp(24px, 5vw, 44px); box-shadow: 0 12px 40px rgba(23, 43, 77, .08); }
    h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.15; margin: 0 0 10px; }
    .intro { font-size: 1.1rem; color: #526078; margin: 0 0 28px; }
    .header, .grade-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 125px) minmax(0, 125px); gap: 14px; align-items: center; }
    .header { font-weight: 700; color: #45546b; margin-bottom: 8px; }
    .header span:not(:first-child) { text-align: center; }
    .grade-row { padding: 14px 0; border-top: 1px solid #e5eaf2; }
    .grade-row label { font-size: 1.12rem; font-weight: 650; }
    input { width: 100%; min-width: 0; padding: 13px 10px; border: 2px solid #c7d2e2; border-radius: 10px; font: inherit; font-size: 1.15rem; text-align: center; background: #fff; color: #18253b; }
    input:focus-visible { outline: 3px solid #94b9ff; outline-offset: 2px; border-color: #265bc1; }
    input:invalid { border-color: #b42318; }
    .result { margin-top: 24px; padding: 24px; background: #edf4ff; border-radius: 16px; text-align: center; }
    .result-label { margin: 0 0 6px; font-size: 1.1rem; font-weight: 650; }
    output { display: block; font-size: clamp(2.6rem, 9vw, 4rem); font-weight: 800; letter-spacing: -.04em; color: #174da8; }
    .message { margin: 16px 0 0; min-height: 1.5em; font-size: 1.05rem; font-weight: 600; text-align: center; }
    .message.error { color: #b42318; }
    .message.success { color: #216e44; }
    @media (max-width: 480px) { .header, .grade-row { grid-template-columns: minmax(0, 1fr) 88px 88px; gap: 8px; } .header { font-size: .9rem; } .grade-row label { font-size: 1rem; } input { padding: 12px 5px; font-size: 1rem; } main { padding: 24px 16px; } }
  </style>
</head>
<body>
  <main>
    <h1>Weighted Grade Calculator</h1>
    <p class="intro">Enter your scores and adjust the weights to calculate your overall grade.</p>
    <div class="header" aria-hidden="true"><span>Category</span><span>Score (0–100)</span><span>Weight (%)</span></div>
    <div class="grade-row"><label for="assignment-score">Assignment</label><input id="assignment-score" aria-label="Assignment score" type="number" min="0" max="100" step="any" value="" placeholder="0–100"><input id="assignment-weight" aria-label="Assignment weight percentage" type="number" min="0" max="100" step="any" value="30"></div>
    <div class="grade-row"><label for="midterm-score">Midterm</label><input id="midterm-score" aria-label="Midterm score" type="number" min="0" max="100" step="any" value="" placeholder="0–100"><input id="midterm-weight" aria-label="Midterm weight percentage" type="number" min="0" max="100" step="any" value="30"></div>
    <div class="grade-row"><label for="final-score">Final</label><input id="final-score" aria-label="Final score" type="number" min="0" max="100" step="any" value="" placeholder="0–100"><input id="final-weight" aria-label="Final weight percentage" type="number" min="0" max="100" step="any" value="40"></div>
    <section class="result" aria-label="Calculated grade"><p class="result-label">Overall Grade</p><output id="overall" aria-live="polite">—</output></section>
    <p id="message" class="message" role="status" aria-live="polite">Enter all three scores to see your grade.</p>
  <section class="share-section">
  <h2>Share This Calculator</h2>
  <p>Scan to open this calculator on your phone.</p>
  <img
    src="qr-code.png"
    alt="QR code linking to this grade calculator"
    width="180"
    height="180"
  >
</section>
  
  </main>
  <script>
    const categories = ['assignment', 'midterm', 'final'];
    const overall = document.getElementById('overall');
    const message = document.getElementById('message');
    function readNumber(id) {
      const input = document.getElementById(id);
      if (input.value.trim() === '') return null;
      const value = Number(input.value);
      return Number.isFinite(value) && value >= 0 && value <= 100 ? value : null;
    }
    function update() {
      const weights = categories.map(name => readNumber(name + '-weight'));
      const scores = categories.map(name => readNumber(name + '-score'));
      const total = weights.every(value => value !== null) ? weights.reduce((a, b) => a + b, 0) : null;
      overall.textContent = '—';
      message.className = 'message';
      if (weights.some(value => value === null)) {
        message.textContent = 'Enter a valid weight between 0% and 100% for each category.';
        message.classList.add('error');
      } else if (Math.abs(total - 100) > 0.000001) {
        message.textContent = `Weights must total 100%. Current total: ${Number(total.toFixed(4))}%.`;
        message.classList.add('error');
      } else if (scores.some(value => value === null)) {
        message.textContent = 'Enter a score between 0 and 100 for each category.';
      } else {
        const grade = scores.reduce((sum, score, index) => sum + score * weights[index] / 100, 0);
        overall.textContent = grade.toFixed(2) + '%';
        message.textContent = 'Weights total 100%.';
        message.classList.add('success');
      }
    }
    document.querySelectorAll('input').forEach(input => input.addEventListener('input', update));
    update();
  </script>
</body>
</html>
